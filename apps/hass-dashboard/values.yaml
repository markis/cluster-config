generator:
  image:
    repository: ghcr.io/markis/hass-dashboard
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

nginx:
  image:
    repository: nginx
    tag: "1.31.5"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  host: "dashboard.markis.network"
  ingressClassName: "traefik"

secretName: hass-dashboard-secrets
