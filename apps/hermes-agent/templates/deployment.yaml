apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        checksum/config: {{ .Files.Get "files/config.yaml" | sha256sum }}
        # Kube-linter suppressions
        ignore-check.kube-linter.io/no-read-only-root-fs: "Init containers need write access for setup"
        ignore-check.kube-linter.io/run-as-non-root: "setup-workspace init container runs as root to set workspace permissions"
    spec:
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: setup-workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              # Run as root to create workspace with proper permissions
              mkdir -p /home/agent/workspace
              chmod 775 /home/agent/workspace
              chown 1000:1000 /home/agent/workspace
              echo "Workspace created with perms:"
              ls -la /home/agent/ | grep workspace
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/agent
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
        - name: setup-ssh-kubeconfig
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              # Setup SSH and kubeconfig
              mkdir -p /home/agent/.ssh /home/agent/.kube
              chmod 700 /home/agent/.ssh
              echo "$SSH_PRIVATE_KEY" > /home/agent/.ssh/id_ed25519
              chmod 400 /home/agent/.ssh/id_ed25519
              printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile /home/agent/.ssh/id_ed25519\n  UserKnownHostsFile /home/agent/.ssh/known_hosts\n' > /home/agent/.ssh/config
              chmod 400 /home/agent/.ssh/config
              echo "$KUBECONFIG_CONTENT" > /home/agent/.kube/config
              chmod 400 /home/agent/.kube/config
              git config --global user.name "$GIT_USER_NAME"
              git config --global user.email "$GIT_USER_EMAIL"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: home
              mountPath: /home/agent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              # Workspace is set up by root init container with proper permissions
              exec /entrypoint.sh hermes gateway run
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: HOME
              value: /home/agent
            - name: HERMES_HOME
              value: /home/agent/workspace
            - name: KUBECONFIG
              value: /home/agent/.kube/config
            - name: RESTIC_HOST
              value: hermes-agent
            - name: HERMES_CONFIG_TEMPLATE
              value: /tmp/hermes-config.yaml
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          resources:
            requests:
              memory: {{ .Values.deployment.resources.requests.memory }}
              cpu: {{ .Values.deployment.resources.requests.cpu }}
            limits:
              memory: {{ .Values.deployment.resources.limits.memory }}
              cpu: {{ .Values.deployment.resources.limits.cpu | quote }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'hermes gateway'"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'hermes gateway'"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: shm
              mountPath: /dev/shm
            - name: config-template
              mountPath: /tmp/hermes-config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: config-template
          configMap:
            name: {{ .Chart.Name }}-config
