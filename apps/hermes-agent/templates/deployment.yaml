apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        checksum/config: {{ .Files.Get "files/config.yaml" | sha256sum }}
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: setup-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              # Create directory structure
              mkdir -p /home/agent/workspace/{sessions,memories,skills,cron,hooks,logs,pairing,image_cache,audio_cache}
              mkdir -p /home/agent/.ssh /home/agent/.kube
              
              # Setup SSH keys
              chmod 700 /home/agent/.ssh
              echo "$SSH_PRIVATE_KEY" > /home/agent/.ssh/id_ed25519
              chmod 400 /home/agent/.ssh/id_ed25519
              printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile /home/agent/.ssh/id_ed25519\n  UserKnownHostsFile /home/agent/.ssh/known_hosts\n' > /home/agent/.ssh/config
              chmod 400 /home/agent/.ssh/config
              
              # Setup kubeconfig
              echo "$KUBECONFIG_CONTENT" > /home/agent/.kube/config
              chmod 400 /home/agent/.kube/config
              
              # Setup git config
              git config --global user.name "$GIT_USER_NAME"
              git config --global user.email "$GIT_USER_EMAIL"
              
              # Create .env file
              touch /home/agent/workspace/.env
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /home/agent
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: home
              mountPath: /home/agent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
        - name: restore-backup
          image: restic/restic:0.18.1
          command:
            - sh
            - -c
            - |
              # Add user entry for UID 1000 (running as root initially)
              echo "agent:x:1000:1000:agent:/tmp:/bin/sh" >> /etc/passwd
              
              # Setup SSH for SFTP
              mkdir -p /tmp/.ssh
              chmod 700 /tmp/.ssh
              echo "$SSH_PRIVATE_KEY" > /tmp/.ssh/id_ed25519
              chmod 600 /tmp/.ssh/id_ed25519
              printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile /tmp/.ssh/id_ed25519\n  UserKnownHostsFile /tmp/.ssh/known_hosts\n' > /tmp/.ssh/config
              chmod 600 /tmp/.ssh/config
              chown -R 1000:1000 /tmp/.ssh
              export HOME=/tmp
              
              # Switch to user 1000 and run restic commands
              su -s /bin/sh agent -c '
                export HOME=/tmp
                restic snapshots > /dev/null 2>&1 || restic init || true
                
                if restic snapshots --quiet --latest 1 > /dev/null 2>&1; then
                  restic restore latest --target / \
                    --exclude /home/agent/workspace/config.yaml \
                    || true
                fi
              '
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
          env:
            - name: RESTIC_HOST
              value: hermes-agent
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: home
              mountPath: /home/agent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Background restic backup process
              (
                # Wait for Hermes to start and create workspace files
                sleep 60
                
                # Initialize repo if needed (uses /home/agent/.ssh/ setup by init container)
                restic snapshots > /dev/null 2>&1 || restic init || true
                
                # Backup loop every 15 minutes
                while true; do
                  restic backup /home/agent/workspace \
                    --tag hermes-agent \
                    --tag "pod:$HOSTNAME" \
                    --exclude /home/agent/workspace/config.yaml \
                    --exclude /home/agent/workspace/logs \
                    --exclude /home/agent/workspace/image_cache \
                    --exclude /home/agent/workspace/audio_cache \
                    --quiet
                  
                  restic forget \
                    --keep-last 48 \
                    --keep-daily 7 \
                    --keep-weekly 4 \
                    --prune \
                    --quiet
                  
                  sleep 900
                done
              ) &
              
              source /opt/venv/bin/activate && \
              exec hermes gateway run
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: HOME
              value: /home/agent
            - name: HERMES_HOME
              value: /home/agent/workspace
            - name: KUBECONFIG
              value: /home/agent/.kube/config
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          resources:
            requests:
              memory: {{ .Values.deployment.resources.requests.memory }}
              cpu: {{ .Values.deployment.resources.requests.cpu }}
            limits:
              memory: {{ .Values.deployment.resources.limits.memory }}
              cpu: {{ .Values.deployment.resources.limits.cpu | quote }}
          livenessProbe:
            exec:
              command: 
                - /bin/sh
                - -c
                - "pgrep -f 'hermes gateway'"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: 
                - /bin/sh
                - -c
                - "pgrep -f 'hermes gateway'"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: shm
              mountPath: /dev/shm
            - name: config-template
              mountPath: /home/agent/workspace/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: config-template
          configMap:
            name: {{ .Chart.Name }}-config
