apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        checksum/config: {{ .Files.Get "files/config.yaml" | sha256sum }}
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 10000
      initContainers:
        - name: restore-backup
          image: restic/restic:latest
          command:
            - sh
            - -c
            - |
              echo "===Restoring Hermes state from restic backup==="
              
              # Setup SSH for SFTP
              mkdir -p /root/.ssh
              chmod 700 /root/.ssh
              echo "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
              chmod 600 /root/.ssh/id_ed25519
              printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile /root/.ssh/id_ed25519\n  UserKnownHostsFile /root/.ssh/known_hosts\n' > /root/.ssh/config
              chmod 600 /root/.ssh/config
              
              # Initialize repo if it doesn't exist (creates empty repo on first run)
              restic snapshots > /dev/null 2>&1 || restic init || true
              
              # Restore latest snapshot if any exist
              if restic snapshots --quiet --latest 1 > /dev/null 2>&1; then
                echo "Found existing snapshots, restoring latest..."
                restic restore latest:/opt/data --target /opt/data || echo "Restore failed or no data, continuing..."
                echo "Restored $(du -sh /opt/data 2>/dev/null | cut -f1 || echo '0') from backup"
              else
                echo "No snapshots found, starting fresh"
                mkdir -p /opt/data
              fi
              
              echo "===Restore complete==="
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: RESTIC_HOST
              value: hermes-agent
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        - name: setup-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |
              echo "===Setting up Hermes configuration==="
              mkdir -p /opt/data/{sessions,memories,skills,cron,hooks,logs,pairing,image_cache,audio_cache}
              
              # Only copy default config if no config exists (fresh install or restore didn't have it)
              if [ ! -f /opt/data/config.yaml ]; then
                echo "No config.yaml found, copying template..."
                cp /config-template/config.yaml /opt/data/config.yaml
              else
                echo "Using existing config.yaml from backup"
              fi
              
              if [ ! -f /opt/data/.env ]; then
                touch /opt/data/.env
              fi
              
              echo "===Configuration setup complete==="
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config-template
              mountPath: /config-template
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gateway", "run"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: HOME
              value: /opt/data
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          resources:
            requests:
              memory: {{ .Values.deployment.resources.requests.memory }}
              cpu: {{ .Values.deployment.resources.requests.cpu }}
            limits:
              memory: {{ .Values.deployment.resources.limits.memory }}
              cpu: {{ .Values.deployment.resources.limits.cpu | quote }}
          livenessProbe:
            exec:
              command: 
                - /bin/sh
                - -c
                - "source /opt/hermes/.venv/bin/activate && hermes status"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "source /opt/hermes/.venv/bin/activate && hermes status"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
        - name: restic-backup
          image: restic/restic:latest
          command:
            - sh
            - -c
            - |
              echo "===Starting restic backup sidecar==="
              
              # Setup SSH for SFTP
              mkdir -p /root/.ssh
              chmod 700 /root/.ssh
              echo "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
              chmod 600 /root/.ssh/id_ed25519
              printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile /root/.ssh/id_ed25519\n  UserKnownHostsFile /root/.ssh/known_hosts\n' > /root/.ssh/config
              chmod 600 /root/.ssh/config
              
              # Initialize repo if needed
              restic snapshots > /dev/null 2>&1 || restic init || true
              
              # Backup loop every 15 minutes
              while true; do
                echo "$(date): Starting backup..."
                
                # Backup with timestamp tag
                restic backup /opt/data \
                  --tag hermes-agent \
                  --tag "pod:$HOSTNAME" \
                  --exclude /opt/data/logs \
                  --exclude /opt/data/image_cache \
                  --exclude /opt/data/audio_cache
                
                if [ $? -eq 0 ]; then
                  echo "$(date): Backup completed successfully"
                  
                  # Keep last 48 backups (12 hours at 15min intervals), last 7 days, last 4 weeks
                  restic forget \
                    --keep-last 48 \
                    --keep-daily 7 \
                    --keep-weekly 4 \
                    --prune \
                    --quiet
                else
                  echo "$(date): Backup failed!"
                fi
                
                # Wait 15 minutes
                sleep 900
              done
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: RESTIC_HOST
              value: hermes-agent
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: data
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: config-template
          configMap:
            name: {{ .Chart.Name }}-config
