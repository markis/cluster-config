apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        checksum/config: {{ .Files.Get "files/config.yaml" | sha256sum }}
        # Kube-linter suppressions for init container that requires write access
        ignore-check.kube-linter.io/no-read-only-root-fs: "Init container needs write access to setup SSH, git config, and restore backups"
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: setup-and-restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              # Setup SSH and kube config first (before restore)
              mkdir -p /home/agent/.ssh /home/agent/.kube
              chmod 700 /home/agent/.ssh
              echo "$SSH_PRIVATE_KEY" > /home/agent/.ssh/id_ed25519
              chmod 400 /home/agent/.ssh/id_ed25519
              printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile /home/agent/.ssh/id_ed25519\n  UserKnownHostsFile /home/agent/.ssh/known_hosts\n' > /home/agent/.ssh/config
              chmod 400 /home/agent/.ssh/config
              
              echo "$KUBECONFIG_CONTENT" > /home/agent/.kube/config
              chmod 400 /home/agent/.kube/config
              
              git config --global user.name "$GIT_USER_NAME"
              git config --global user.email "$GIT_USER_EMAIL"
              
              # Restore from backup using restic (BEFORE creating workspace directories)
              restic snapshots > /dev/null 2>&1 || restic init || true
              
              # Find latest snapshot with substantial content (> 10 MB indicates jobs.json exists)
              # Unset RESTIC_HOST to search across all pod hostnames
              SNAPSHOT_ID=$(unset RESTIC_HOST && restic snapshots --path /home/agent/workspace --compact 2>/dev/null | \
                awk '$NF ~ /MiB$/ && $(NF-1) > 10 {id=$1} END {print id}')
              
              if [ -n "$SNAPSHOT_ID" ]; then
                echo "DEBUG: Restoring from snapshot $SNAPSHOT_ID"
                unset RESTIC_HOST && restic restore "$SNAPSHOT_ID" --path /home/agent/workspace --target / \
                  --exclude /home/agent/workspace/config.yaml \
                  || true
                echo "DEBUG: Restore complete, checking files..."
                echo "DEBUG: Workspace root:"
                ls -la /home/agent/workspace/ 2>&1 | head -15
                echo "DEBUG: Cron directory after restore:"
                ls -la /home/agent/workspace/cron/ 2>&1 || echo "DEBUG: cron dir does not exist after restore"
              elif unset RESTIC_HOST && restic snapshots --path /home/agent/workspace --quiet --latest 1 > /dev/null 2>&1; then
                echo "DEBUG: Restoring from latest snapshot"
                unset RESTIC_HOST && restic restore latest --path /home/agent/workspace --target / \
                  --exclude /home/agent/workspace/config.yaml \
                  || true
              fi
              
              echo "DEBUG: Creating missing directories..."
              mkdir -p /home/agent/workspace/{sessions,memories,skills,cron,hooks,logs,pairing,image_cache,audio_cache}
              
              echo "DEBUG: After mkdir, workspace root:"
              ls -la /home/agent/workspace/ 2>&1 | head -15
              echo "DEBUG: Cron directory after mkdir:"
              ls -la /home/agent/workspace/cron/ 2>&1 || echo "DEBUG: cron dir missing after mkdir"
              
              touch /home/agent/workspace/.env
              echo "DEBUG: Init container complete"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /home/agent
            - name: RESTIC_HOST
              value: hermes-agent
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: home
              mountPath: /home/agent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              # Copy config from temp location to workspace
              cp /tmp/hermes-config.yaml /home/agent/workspace/config.yaml
              # Run sleep for debugging
              sleep infinity
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: HOME
              value: /home/agent
            - name: HERMES_HOME
              value: /home/agent/workspace
            - name: KUBECONFIG
              value: /home/agent/.kube/config
            - name: RESTIC_HOST
              value: hermes-agent
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          resources:
            requests:
              memory: {{ .Values.deployment.resources.requests.memory }}
              cpu: {{ .Values.deployment.resources.requests.cpu }}
            limits:
              memory: {{ .Values.deployment.resources.limits.memory }}
              cpu: {{ .Values.deployment.resources.limits.cpu | quote }}
          livenessProbe:
            exec:
              command: 
                - /bin/sh
                - -c
                - "pgrep -f 'hermes gateway'"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: 
                - /bin/sh
                - -c
                - "pgrep -f 'hermes gateway'"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: shm
              mountPath: /dev/shm
            - name: config-template
              mountPath: /tmp/hermes-config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: config-template
          configMap:
            name: {{ .Chart.Name }}-config
