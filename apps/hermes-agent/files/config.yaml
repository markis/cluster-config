# Hermes Agent Configuration
# This file is managed by Kubernetes ConfigMap

# Terminal backend configuration
terminal:
  backend: local

display:
  skin: markis-bot

# Gateway configuration
gateway:
  enabled: true
  platforms:
    telegram:
      enabled: false
    discord:
      enabled: true
    slack:
      enabled: false

# Model configuration (override with environment variables)
model:
  provider: opencode-go
  model: minimax-m2.7

# Discord-specific settings
discord:
  require_mention: true
  auto_thread: false
  reactions: false

# Session isolation
group_sessions_per_user: true

# Memory configuration
memory:
  enabled: true
  max_tokens: 100000

# Skills configuration
skills:
  enabled: true
  auto_create: true
  auto_improve: true

# Logging
logging:
  level: INFO

browser:
  camofox:
    managed_persistence: true

mcp_servers:
  perplexity:
    command: "npx"
    args: ["-y", "@perplexity-ai/mcp-server"]
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"
    tools:
      include: [perplexity_ask, perplexity_search]
      prompts: false
      resources: false
