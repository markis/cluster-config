apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: meter-reader
    app.kubernetes.io/part-of: {{ .Chart.Name }}
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "Init container needs to write config file to shared volume"
    ignore-check.kube-linter.io/privileged-container: "Requires privileged mode for USB RTL-SDR device access"
    ignore-check.kube-linter.io/privilege-escalation-container: "Privileged container requires privilege escalation for USB device control"
    ignore-check.kube-linter.io/run-as-non-root: "Init container needs root to install packages (apk add gettext)"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Only one instance should access the USB device
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: meter-reader
        app.kubernetes.io/part-of: {{ .Chart.Name }}
    spec:
      # Target nodes with RTL-SDR hardware
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      initContainers:
        # Substitute environment variables in config file
        - name: config-init
          image: alpine:3.21
          command: ['sh', '-c', 'apk add --no-cache gettext && envsubst < /config-template/rtlsdr2mqtt.yaml > /config/rtlsdr2mqtt.yaml']
          env:
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.secretName }}
                  key: mqtt-username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.secretName }}
                  key: mqtt-password
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: America/New_York
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rtlsdr2mqtt.yaml
              subPath: rtlsdr2mqtt.yaml
              readOnly: true
            - name: usb
              mountPath: /dev/bus/usb
            - name: healthcheck
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          # Privileged required for libusb USB access
          # SYS_RAWIO capability alone is insufficient for RTL-SDR device control
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          # File-based health check matching Dockerfile HEALTHCHECK
          livenessProbe:
            exec:
              command: ["/usr/bin/healthcheck.sh"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/bin/healthcheck.sh"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        - name: config-template
          configMap:
            name: {{ .Chart.Name }}-config
        - name: config
          emptyDir: {}
        - name: healthcheck
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
