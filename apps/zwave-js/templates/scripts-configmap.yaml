apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-scripts
  labels:
    app: {{ .Chart.Name }}
data:
  backup.sh: |
    {{ .Files.Get "scripts/backup.sh" | nindent 4 }}
  restore.sh: |
    {{ .Files.Get "scripts/restore.sh" | nindent 4 }}
  init-config.sh: |
    {{ .Files.Get "scripts/init-config.sh" | nindent 4 }}
