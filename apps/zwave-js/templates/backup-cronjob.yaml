{{- if .Values.backup.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-backup
  labels:
    app: {{ .Chart.Name }}
    component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ .Chart.Name }}
            component: backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: alpine:3.19
            command: ["/bin/sh", "/scripts/backup.sh"]
            env:
            - name: BACKUP_HOST
              value: {{ .Values.backup.destination.host | quote }}
            - name: BACKUP_USER
              value: {{ .Values.backup.destination.user | quote }}
            - name: BACKUP_PATH
              value: {{ .Values.backup.destination.path | quote }}
            - name: BACKUP_RETENTION
              value: {{ .Values.backup.retention | quote }}
            - name: SSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: backup-ssh-key
            volumeMounts:
            - name: store
              mountPath: /store
              readOnly: true
            - name: scripts
              mountPath: /scripts
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "200m"
          volumes:
          - name: store
            persistentVolumeClaim:
              claimName: store-{{ .Chart.Name }}-0
          - name: scripts
            configMap:
              name: {{ .Chart.Name }}-scripts
              defaultMode: 0755
{{- end }}
