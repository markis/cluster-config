# This is a manual Job template for restoring from backup
# To use:
# 1. Enable in values.yaml: restore.enabled=true
# 2. Set BACKUP_FILE in values.yaml: restore.backupFile="zwave-js-20260216-030000.tar.gz"
# 3. kubectl apply or let ArgoCD sync
# 4. Monitor: kubectl logs -f job/zwave-js-restore
# 5. Delete job when done: kubectl delete job zwave-js-restore
# 6. Disable in values.yaml: restore.enabled=false
{{- if .Values.restore.enabled -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Chart.Name }}-restore"
  labels:
    app: {{ .Chart.Name }}
    component: restore
  annotations:
    # This prevents ArgoCD from auto-applying this job
    argocd.argoproj.io/sync-options: Prune=false
spec:
  ttlSecondsAfterFinished: 3600  # Auto-cleanup after 1 hour
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: restore
    spec:
      restartPolicy: Never
      containers:
      - name: restore
        image: alpine:3.19
        command: ["/bin/sh", "/scripts/restore.sh"]
        env:
        - name: BACKUP_HOST
          value: {{ .Values.backup.destination.host | quote }}
        - name: BACKUP_USER
          value: {{ .Values.backup.destination.user | quote }}
        - name: BACKUP_PATH
          value: {{ .Values.backup.destination.path | quote }}
        - name: BACKUP_FILE
          value: {{ .Values.restore.backupFile | quote }}
        - name: SSH_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: backup-ssh-key
        volumeMounts:
        - name: store
          mountPath: /store
        - name: scripts
          mountPath: /scripts
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: store
        persistentVolumeClaim:
          claimName: store-{{ .Chart.Name }}-0
      - name: scripts
        configMap:
          name: {{ .Chart.Name }}-scripts
          defaultMode: 0755
{{- end }}
