image:
  repository: ghcr.io/markis/zeroclaw-container
  tag: "v0.0.1"
  pullPolicy: IfNotPresent

replicas: 0

deployment:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

service:
  type: ClusterIP
  port: 80
  targetPort: 42617

ingress:
  host: zeroclaw.markis.network

secretName: zeroclaw-secrets
imagePullSecret: ghcr-pull-secret
