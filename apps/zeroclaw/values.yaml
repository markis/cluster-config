enabled: true

image:
  repository: ghcr.io/markis/zeroclaw-container
  tag: "v0.10.11"
  pullPolicy: IfNotPresent

replicas: 1

deployment:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

service:
  type: ClusterIP
  port: 80
  targetPort: 42617

ingress:
  host: zeroclaw.markis.network

secretName: zeroclaw-secrets
imagePullSecret: ghcr-pull-secret
