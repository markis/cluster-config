default_provider = "custom:default"
default_model = "minimax-m3"
default_temperature = 0.7

[agent]
compact_context = false
max_tool_iterations = 1000
max_history_messages = 100
parallel_tools = false
tool_dispatcher = "auto"
message_timeout_secs = 600

[autonomy]
level = "full"
workspace_only = false
allowed_commands = ["*"]
allowed_roots = ["*"]
forbidden_paths = [
  "/home/agent/.ssh",
  "/home/agent/.kube",
  "/home/agent/.zeroclaw",
  "/proc",
  "/sys",
]
max_actions_per_hour = 500
shell_env_passthrough = [
  "KUBECONFIG",
  "RESTIC_REPOSITORY",
  "RESTIC_PASSWORD",
  "RESTIC_HOST",
]

[runtime]
kind = "native" # "native" or "docker"

[channels.discord.bot]
approval_timeout_secs = 0
archive = false
enabled = true
interrupt_on_new_message = false
listen_to_bots = false
mention_only = false
multi_message_delay_ms = 0
reaction_notifications = "off"
reply_min_interval_secs = 0
reply_queue_depth_max = 0
slash_command_scope = "global"
slash_commands = false
stall_timeout_secs = 0
stream_mode = "off"
channel_ids = ["$DISCORD_CHANNEL_ID"]
guild_ids = ["$DISCORD_GUILD_ID"]
bot_token = "$DISCORD_TOKEN_ENCRYPTED"

[gateway]
port = 42617
host = "0.0.0.0"
allow_public_bind = true
require_pairing = true
paired_tokens = ["$GATEWAY_PAIRED_TOKEN_ENCRYPTED"]
pair_rate_limit_per_minute = 30
webhook_rate_limit_per_minute = 300

[reliability]
fallback_providers = ["opencode-go"]
provider_retries = 3
provider_backoff_ms = 1000
channel_initial_backoff_secs = 2
channel_max_backoff_secs = 120

[memory]
backend = "markdown.markdown"
auto_save = true
embedding_provider = "none"   # none | openai | custom:https://...
vector_weight = 0.7
keyword_weight = 0.3

[scheduler]
enabled = true
max_tasks = 64
max_concurrent = 4

[security.audit]
enabled = true
log_path = "audit.log"

[browser]
enabled = true
backend = "agent_browser"
native_headless = true
native_chrome_path = "$CHROMIUM_PATH"
allowed_domains = ["*"]

[identity]
format = "openclaw"

[http_request]
enabled = true
timeout_secs = 30

[providers]

[providers.models]

[providers.models.custom]

[providers.models.custom.default]
model = "minimax-m3"
uri = "https://ollama.com/v1"
api_key = "$OLLAMA_API_KEY_ENCRYPTED"

[providers.models.opencode.go]
api_key = "$OPENCODE_API_KEY_ENCRYPTED"

[agents.main]
enabled = true
model_provider = "custom:default"
risk_profile = "yolo"
runtime_profile = "unbounded"

[acp]
default_agent = "main"

[runtime_profiles.unbounded]
agentic = true
agentic_timeout_secs = 1800
compact_context = false
delegation_timeout_secs = 900
keep_tool_context_turns = 8
max_actions_per_hour = 4294967295
max_context_tokens = 128000
max_cost_per_day_cents = 4294967295
max_delegation_depth = 8
max_history_messages = 200
max_system_prompt_chars = 64000
max_tool_iterations = 100
max_tool_result_chars = 64000
memory_recall_limit = 10
parallel_tools = true
shell_timeout_secs = 600
strict_tool_parsing = false

[runtime_profiles.unbounded.context_compression]
enabled = false
identifier_policy = "strict"
max_passes = 3
protect_first_n = 3
protect_last_n = 4
source_max_chars = 50000
summary_max_chars = 4000
threshold_ratio = 0.5
timeout_secs = 60
tool_result_retrim_chars = 2000

[runtime_profiles.unbounded.eval]
enabled = false
max_retries = 1
min_quality_score = 0.5

[runtime_profiles.unbounded.history_pruning]
collapse_tool_results = true
enabled = false
keep_recent = 4
max_tokens = 8192

[runtime_profiles.unbounded.thinking]
default_level = "medium"
native_thinking = false

[runtime_profiles.unbounded.tool_receipts]
enabled = false
inject_system_prompt = true
show_in_response = false

[risk_profiles.yolo]
allowed_commands = ["*"]
auto_approve = ["*"]
block_high_risk_commands = false
level = "full"
require_approval_for_medium_risk = false
sandbox_enabled = false
workspace_only = false

[risk_profiles.yolo.delegation_policy]
mode = "allow"

[onboard_state]
quickstart_completed = true

[cost]
enabled = false
daily_limit_usd = 10
monthly_limit_usd = 100
