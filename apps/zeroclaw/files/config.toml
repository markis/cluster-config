default_provider = "opencode-go"
default_model = "glm-5.1"
default_temperature = 0.7

[agent]
compact_context = false
max_tool_iterations = 1000
max_history_messages = 100
parallel_tools = false
tool_dispatcher = "auto"
message_timeout_secs = 600

[autonomy]
level = "full"
workspace_only = false
allowed_commands = ["*"]
allowed_roots = ["/dev/null"]
max_actions_per_hour = 500
shell_env_passthrough = [
  "KUBECONFIG",
  "RESTIC_REPOSITORY",
  "RESTIC_PASSWORD",
  "RESTIC_HOST",
]

[runtime]
kind = "native" # "native" or "docker"

[channels_config.discord]
bot_token = "$DISCORD_TOKEN"
guild_id = "$DISCORD_GUILD_ID"
allowed_users = ["$DISCORD_ALLOW_FROM"]
mention_only = true

[gateway]
port = 42617
host = "0.0.0.0"
allow_public_bind = true
require_pairing = true
paired_tokens = ["$GATEWAY_PAIRED_TOKEN"]
pair_rate_limit_per_minute = 30
webhook_rate_limit_per_minute = 300

[reliability]
fallback_providers = ["opencode"]
provider_retries = 3
provider_backoff_ms = 1000
channel_initial_backoff_secs = 2
channel_max_backoff_secs = 120

[memory]
backend = "markdown"        # sqlite | lucid | postgres | markdown | none
auto_save = true
embedding_provider = "none" # none | openai | custom:https://...
vector_weight = 0.7
keyword_weight = 0.3

[scheduler]
enabled = true
max_tasks = 64
max_concurrent = 4

[security.audit]
enabled = true
log_path = "audit.log"

[browser]
enabled = true
backend = "agent_browser"
native_headless = true
native_chrome_path = "$CHROMIUM_PATH"
allowed_domains = ["*"]

[identity]
format = "openclaw"

[http_request]
enabled = true
timeout_secs = 30

[cost]
enabled = false
daily_limit_usd = 10
monthly_limit_usd = 100
