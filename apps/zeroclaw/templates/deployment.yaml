{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        checksum/config: {{ .Files.Get "files/config.toml" | sha256sum }}
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      initContainers:
        - name: config-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |
              echo "===Starting Init Config===" && \
              cd / && \
              mkdir -p /home/agent/.ssh /home/agent/.kube /home/agent/.zeroclaw /home/agent/workspace && \
              echo "$SECRET_KEY" > /home/agent/.zeroclaw/.secret_key && \
              envsubst '$DISCORD_TOKEN_ENCRYPTED $DISCORD_GUILD_ID $DISCORD_ALLOW_FROM $GATEWAY_PAIRED_TOKEN_ENCRYPTED $CHROMIUM_PATH' \
                < /config-template/config.toml > /home/agent/.zeroclaw/config.toml && \
              chmod 400 /home/agent/.zeroclaw/.secret_key && \
              chmod 400 /home/agent/.zeroclaw/config.toml && \
              echo "$KUBECONFIG_CONTENT" > /home/agent/.kube/config && \
              chmod 400 /home/agent/.kube/config && \
              chmod 700 /home/agent/.ssh && \
              echo "$SSH_PRIVATE_KEY" > /home/agent/.ssh/id_ed25519 && \
              chmod 400 /home/agent/.ssh/id_ed25519 && \
              printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile /home/agent/.ssh/id_ed25519\n  UserKnownHostsFile /home/agent/.ssh/known_hosts\n' > /home/agent/.ssh/config && \
              chmod 400 /home/agent/.ssh/config && \
              git config --global user.name "$GIT_USER_NAME" && \
              git config --global user.email "$GIT_USER_EMAIL" && \
              rm -rf /home/agent/workspace && \
              GIT_SSH_COMMAND="ssh -i /home/agent/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/home/agent/.ssh/known_hosts" \
                git clone git@github.com:markis/zeroclaw-markis-bot.git /home/agent/workspace && \
              mkdir -p /home/agent/workspace && \
              restic restore latest:/home/agent/workspace --target /home/agent/workspace && \
              echo "===Done Init Config==="
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: HOME
              value: /home/agent
            - name: CHROMIUM_PATH
              value: /usr/local/bin/chromium
            - name: OPENCODE_GO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: OPENCODE_API_KEY
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: home
              mountPath: /home/agent
            - name: tmp
              mountPath: /tmp
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["zeroclaw", "daemon"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: RESTIC_HOST
              value: zeroclaw
            - name: ZEROCLAW_HOME
              value: /home/agent
            - name: ZEROCLAW_DATA_DIR
              value: /home/agent/data
            - name: ZEROCLAW_WORKSPACE
              value: /home/agent/workspace
            - name: KUBECONFIG
              value: /home/agent/.kube/config
            - name: HOME
              value: /home/agent
            - name: OPENCODE_GO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: OPENCODE_API_KEY
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          resources:
            requests:
              memory: {{ .Values.deployment.resources.requests.memory }}
              cpu: {{ .Values.deployment.resources.requests.cpu }}
            limits:
              memory: {{ .Values.deployment.resources.limits.memory }}
              cpu: {{ .Values.deployment.resources.limits.cpu | quote }}
          livenessProbe:
            exec:
              command: ["zeroclaw", "status", "--format=exit-code"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["zeroclaw", "status", "--format=exit-code"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-template
          configMap:
            name: {{ .Chart.Name }}-config-template
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
{{- end }}
