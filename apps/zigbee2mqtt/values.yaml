# Zigbee2MQTT deployment enabled
replicaCount: 1

image:
  repository: koenkk/zigbee2mqtt
  tag: "2.8.0"
  pullPolicy: IfNotPresent

# Zigbee adapter configuration
serial:
  port: "tcp://10.0.0.8:7638"
  baudrate: 115200
  adapter: "zstack"
  disableLed: false

# Advanced Zigbee settings
advanced:
  transmitPower: 20
  # The CC2652 can handle more simultaneous Zigbee messages,
  # reducing lag in high-density networks
  adapterConcurrent: 16
  # Network key and PAN ID come from 1Password secret
  # networkKey: array of 16 bytes for encryption
  # panId: unique network identifier (0-65535)
  # extPanId: array of 8 bytes for extended network identifier
  channel: 15 # Different from other instance (channel 25)

# MQTT connection
mqtt:
  server: "mqtt://vernemq.default.svc.cluster.local:1883"
  baseTopic: "zigbee2mqtt"
  # username and password come from 1Password secret

# Home Assistant integration
homeassistant:
  enabled: true
  discoveryTopic: "homeassistant"
  statusTopic: "homeassistant/status"

# Frontend configuration
frontend:
  enabled: true
  port: 8080
  auth: false # Authentication handled by Traefik/Caddy

# Logging
log:
  level: "info"

# Storage
persistence:
  enabled: true
  storageClassName: "" # Use cluster default
  size: "1Gi"

# Resources
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Service
service:
  type: ClusterIP
  port: 8080

# Ingress
ingress:
  enabled: true
  host: "zigbee.markis.network"
  ingressClassName: "traefik"

# 1Password integration
secretName: zigbee2mqtt-secrets
onepassword:
  itemPath: "vaults/k8s-secrets/items/zigbee2mqtt"

# Backup configuration
backup:
  enabled: true
  retention: 7 # Retention: keep last N backups
  schedule: "0 2 * * *" # Daily at 2 AM
  # SSH backup destination
  destination:
    host: "10.0.0.70" # Target node for backups
    user: "markis" # SSH user for backup host
    path: "/mnt/drive0/servers/zigbee" # Path on target node

# Restore configuration (manual - only enable when needed)
restore:
  enabled: true
  backupFile: "zigbee2mqtt-20260227-070008.tar.gz"
