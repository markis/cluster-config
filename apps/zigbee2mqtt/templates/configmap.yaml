apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Chart.Name }}-config"
  labels:
    app: {{ .Chart.Name }}
data:
  configuration.yaml: |
    {{- if .Values.homeassistant.enabled }}
    # Home Assistant integration
    homeassistant:
      discovery_topic: {{ .Values.homeassistant.discoveryTopic }}
      status_topic: {{ .Values.homeassistant.statusTopic }}
    {{- else }}
    # Home Assistant integration disabled
    homeassistant: false
    {{- end }}

    # MQTT settings
    mqtt:
      server: {{ .Values.mqtt.server }}
      base_topic: {{ .Values.mqtt.baseTopic }}
      user: ${MQTT_USERNAME}
      password: ${MQTT_PASSWORD}
      keepalive: {{ .Values.mqtt.keepalive }}
      version: {{ .Values.mqtt.version }}
      {{- if .Values.mqtt.includeDeviceInformation }}
      include_device_information: true
      {{- end }}

    # Serial settings
    serial:
      port: {{ .Values.serial.port }}
      baudrate: {{ .Values.serial.baudrate }}
      adapter: {{ .Values.serial.adapter }}
      disable_led: {{ .Values.serial.disableLed }}
      rtscts: false

    # Advanced settings
    advanced:
      log_level: {{ .Values.log.level }}
      log_output: ['console']
      log_rotation: false
      pan_id: ${ZIGBEE_PAN_ID}
      ext_pan_id: ${ZIGBEE_EXT_PAN_ID}
      channel: {{ .Values.advanced.channel }}
      network_key: ${ZIGBEE_NETWORK_KEY}
      transmit_power: {{ .Values.advanced.transmitPower }}
      adapter_concurrent: {{ .Values.advanced.adapterConcurrent }}
      adapter_delay: 0
      cache_state: true
      cache_state_persistent: true
      cache_state_send_on_startup: true
      last_seen: {{ .Values.advanced.lastSeen }}
      {{- if .Values.advanced.elapsed }}
      elapsed: true
      {{- end }}

    # Frontend settings
    frontend:
      port: {{ .Values.frontend.port }}
      {{- if .Values.frontend.url }}
      url: {{ .Values.frontend.url }}
      {{- end }}
      {{- if .Values.frontend.authToken }}
      auth_token: ${FRONTEND_AUTH_TOKEN}
      {{- end }}

    # Device availability monitoring
    {{- if .Values.availability.enabled }}
    availability:
      enabled: true
      active:
        timeout: {{ .Values.availability.activeTimeout }}
      passive:
        timeout: {{ .Values.availability.passiveTimeout }}
    {{- end }}

    # OTA firmware updates
    ota:
      update_check_interval: {{ .Values.ota.updateCheckInterval }}
      disable_automatic_update_check: {{ .Values.ota.disableAutomaticUpdateCheck }}

    # Device options
    device_options:
      retain: {{ .Values.deviceOptions.retain }}
      qos: {{ .Values.deviceOptions.qos }}
      optimistic: {{ .Values.deviceOptions.optimistic }}

    # Note: devices and groups are managed by Zigbee2MQTT and stored in configuration.yaml on the persistent volume
    # The init-config.sh script preserves existing devices/groups when updating infrastructure settings
