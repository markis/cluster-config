apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  serviceName: {{ .Chart.Name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: zigbee2mqtt
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.frontend.port }}
          protocol: TCP
        env:
        - name: MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: mqtt-username
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: mqtt-password
        - name: ZIGBEE_PAN_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-pan-id
        - name: ZIGBEE_EXT_PAN_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-ext-pan-id
        - name: ZIGBEE_NETWORK_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-network-key
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/data/configuration.yaml
          subPath: configuration.yaml
          readOnly: true
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: {{ .Chart.Name }}-config
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.persistence.storageClassName }}
      storageClassName: {{ .Values.persistence.storageClassName }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
  {{- else }}
      - name: data
        emptyDir: {}
  {{- end }}
