apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Chart.Name }}"
  labels:
    app: "{{ .Chart.Name }}"
spec:
  serviceName: {{ .Chart.Name }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/scripts: {{ include (print $.Template.BasePath "/scripts-configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
      - name: config-init
        image: alpine:3.19
        command: ["/bin/sh", "/scripts/init-config.sh"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        env:
        - name: MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: mqtt-username
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: mqtt-password
        - name: ZIGBEE_PAN_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-pan-id
        - name: ZIGBEE_EXT_PAN_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-ext-pan-id
        - name: ZIGBEE_NETWORK_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-network-key
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config-template
        - name: scripts
          mountPath: /scripts
      containers:
      - name: zigbee2mqtt
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - name: http
          containerPort: {{ .Values.frontend.port }}
          protocol: TCP
        env:
        - name: TZ
          value: "America/New_York"
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: config
        configMap:
          name: {{ .Chart.Name }}-config
      - name: scripts
        configMap:
          name: {{ .Chart.Name }}-scripts
          defaultMode: 0755
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.persistence.storageClassName }}
      storageClassName: {{ .Values.persistence.storageClassName }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
  {{- else }}
      - name: data
        emptyDir: {}
  {{- end }}
