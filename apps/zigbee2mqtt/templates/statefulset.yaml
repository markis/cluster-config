apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  serviceName: {{ .Chart.Name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      initContainers:
      - name: config-init
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          # Replace environment variables in config and write to data volume
          cat /config-template/configuration.yaml | \
            sed "s/\${MQTT_USERNAME}/$MQTT_USERNAME/g" | \
            sed "s/\${MQTT_PASSWORD}/$MQTT_PASSWORD/g" | \
            sed "s/\${ZIGBEE_PAN_ID}/$ZIGBEE_PAN_ID/g" | \
            sed "s/\${ZIGBEE_EXT_PAN_ID}/$ZIGBEE_EXT_PAN_ID/g" | \
            sed "s/\${ZIGBEE_NETWORK_KEY}/$ZIGBEE_NETWORK_KEY/g" \
            > /data/configuration.yaml
          
          echo "Configuration initialized"
          cat /data/configuration.yaml
        env:
        - name: MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: mqtt-username
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: mqtt-password
        - name: ZIGBEE_PAN_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-pan-id
        - name: ZIGBEE_EXT_PAN_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-ext-pan-id
        - name: ZIGBEE_NETWORK_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: zigbee-network-key
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config-template
      containers:
      - name: zigbee2mqtt
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.frontend.port }}
          protocol: TCP
        env:
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: config
        configMap:
          name: {{ .Chart.Name }}-config
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.persistence.storageClassName }}
      storageClassName: {{ .Values.persistence.storageClassName }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
  {{- else }}
      - name: data
        emptyDir: {}
  {{- end }}
