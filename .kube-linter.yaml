---
# kube-linter configuration for cluster-config
# Focus on critical security issues while allowing practical deployment patterns

checks:
  doNotAutoAddDefaults: true
  
  # Include only important security and reliability checks
  include:
    # Security - Critical
    - "run-as-non-root"
    - "no-read-only-root-fs"
    - "drop-net-raw-capability"
    - "privilege-escalation-container"
    - "privileged-container"
    
    # Security - Important
    - "unset-cpu-requirements"
    - "unset-memory-requirements"
    
    # Reliability
    - "no-liveness-probe"
    - "no-readiness-probe"

customChecks: []
