name: Helm Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  discover-charts:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.find-charts.outputs.charts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find all Helm charts
        id: find-charts
        run: |
          # Find all directories containing Chart.yaml and output as JSON array
          charts=$(find . -name Chart.yaml -exec dirname {} \; | jq -R -s -c 'split("\n")[:-1]')
          echo "charts=$charts" >> $GITHUB_OUTPUT
          echo "Found charts: $charts"

  test-charts:
    needs: discover-charts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover-charts.outputs.charts) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Lint chart
        run: |
          echo "Linting ${{ matrix.chart }}..."
          helm lint "${{ matrix.chart }}" --strict

      - name: Template chart
        run: |
          echo "Templating ${{ matrix.chart }}..."
          helm template "${{ matrix.chart }}" --debug > /dev/null

      - name: Validate with kubeconform
        run: |
          echo "Validating ${{ matrix.chart }}..."
          helm template "${{ matrix.chart }}" | kubeconform -strict -kubernetes-version 1.25.0 -summary -ignore-missing-schemas

